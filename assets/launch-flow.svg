<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="App launch flow"><title>App launch flow</title><defs><radialGradient id="la" cx=".15" cy=".1" r=".7"><stop offset="0" stop-color="#3a2a7a" stop-opacity=".55"/><stop offset="1" stop-color="#3a2a7a" stop-opacity="0"/></radialGradient><radialGradient id="lb" cx=".9" cy=".95" r=".6"><stop offset="0" stop-color="#f2cf8b" stop-opacity=".16"/><stop offset="1" stop-color="#f2cf8b" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="300" fill="#05060b"/><rect width="1200" height="300" fill="url(#la)"/><rect width="1200" height="300" fill="url(#lb)"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4z" fill="#f2cf8b"/></marker></defs>
<text x="40" y="46" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="11" letter-spacing="4" fill="#f2cf8b">APP LAUNCH · TAP TO WORLD</text>
<g><rect x="40" y="82" width="196" height="112" rx="16" fill="#0d101c" stroke="#6fe3f2" stroke-opacity=".4"/><circle cx="70" cy="116" r="13" fill="#6fe3f2" fill-opacity=".16" stroke="#6fe3f2"/><text x="70" y="120.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#6fe3f2">1</text><text x="58" y="152" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f3f1ec">Tap an icon</text><text x="58" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9a7b3">launcher, orbit or card link</text></g><path d="M240 138H262" stroke="#f2cf8b" stroke-width="1.5" marker-end="url(#ar)"/><g><rect x="266" y="82" width="196" height="112" rx="16" fill="#0d101c" stroke="#ffbd78" stroke-opacity=".4"/><circle cx="296" cy="116" r="13" fill="#ffbd78" fill-opacity=".16" stroke="#ffbd78"/><text x="296" y="120.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#ffbd78">2</text><text x="284" y="152" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f3f1ec">bindLaunch</text><text x="284" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9a7b3">plain left click only</text></g><path d="M466 138H488" stroke="#f2cf8b" stroke-width="1.5" marker-end="url(#ar)"/><g><rect x="492" y="82" width="196" height="112" rx="16" fill="#0d101c" stroke="#d8c18a" stroke-opacity=".4"/><circle cx="522" cy="116" r="13" fill="#d8c18a" fill-opacity=".16" stroke="#d8c18a"/><text x="522" y="120.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#d8c18a">3</text><text x="510" y="152" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f3f1ec">Circle opens</text><text x="510" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9a7b3">from the tap point, world colour</text></g><path d="M692 138H714" stroke="#f2cf8b" stroke-width="1.5" marker-end="url(#ar)"/><g><rect x="718" y="82" width="196" height="112" rx="16" fill="#0d101c" stroke="#d5a5ff" stroke-opacity=".4"/><circle cx="748" cy="116" r="13" fill="#d5a5ff" fill-opacity=".16" stroke="#d5a5ff"/><text x="748" y="120.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#d5a5ff">4</text><text x="736" y="152" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f3f1ec">Icon rises</text><text x="736" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9a7b3">name and language appear</text></g><path d="M918 138H940" stroke="#f2cf8b" stroke-width="1.5" marker-end="url(#ar)"/><g><rect x="944" y="82" width="196" height="112" rx="16" fill="#0d101c" stroke="#8fdaa1" stroke-opacity=".4"/><circle cx="974" cy="116" r="13" fill="#8fdaa1" fill-opacity=".16" stroke="#8fdaa1"/><text x="974" y="120.5" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#8fdaa1">5</text><text x="962" y="152" font-family="'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#f3f1ec">Load the world</text><text x="962" y="174" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9a7b3">location.assign(href)</text></g>
<rect x="40" y="224" width="1120" height="52" rx="12" fill="#ffffff08" stroke="#ffffff1a"/>
<text x="62" y="255" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#a9a7b3">Modified clicks (ctrl, cmd, shift, middle) keep native behaviour. Reduced motion swaps the circle for a 0.2 s fade. A bfcache return resets the overlay.</text>
</svg>